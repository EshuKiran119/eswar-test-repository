<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample Store | QA demonstration</title>
<style>body{font:17px/1.5 Arial,sans-serif;background:#f3f6f9;color:#183148;margin:0}main{max-width:680px;margin:5vh auto;background:white;padding:32px;border-radius:8px}label{display:block;margin-top:16px}input,select,button{font:inherit;padding:10px}input,select{display:block;width:90%;border:1px solid #8b9daf;border-radius:4px}button{margin:18px 8px 0 0;background:#183148;color:white;border:0;border-radius:4px}button:focus-visible{outline:3px solid #3386c5;outline-offset:3px}[role=alert]{color:#a21c2b}small{color:#536477}[hidden]{display:none}</style>
<main><h1>Sample Store</h1><small>Fictional local QA demonstration. Synthetic users and orders only.</small>
<section id="login"><h2>Sign in</h2><form id="login-form"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></section>
<section id="shop" hidden><h2>Shop</h2><form id="order-form"><label for="product">Product</label><select id="product"></select><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" max="10" value="1" required><button type="submit">Place order</button></form><section id="confirmation" hidden aria-live="polite"><h2>Order confirmation</h2><p>Order ID: <span data-testid="order-id"></span></p><p>Total: <span data-testid="order-total"></span></p></section><button id="logout" type="button">Sign out</button></section><p role="alert" id="error"></p></main>
<script>
const $=s=>document.querySelector(s);let token=sessionStorage.getItem('demo-token')||'';let lastOrder='';
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=r.status===204?null:await r.json();if(!r.ok)throw new Error(data.error||'request_failed');return data;}
function loginScreen(){token='';sessionStorage.removeItem('demo-token');$('#login').hidden=false;$('#shop').hidden=true;$('#password').value='';history.replaceState(null,'','/login');}
async function shopScreen(){const data=await api('/api/products');$('#product').replaceChildren();for(const p of data.products){const o=document.createElement('option');o.value=p.sku;o.textContent=p.name;$('#product').append(o);}$('#login').hidden=true;$('#shop').hidden=false;$('#confirmation').hidden=true;history.replaceState(null,'','/shop');}
$('#login-form').addEventListener('submit',async event=>{event.preventDefault();$('#error').textContent='';try{const data=await api('/api/login','POST',{username:$('#username').value,password:$('#password').value});token=data.token;sessionStorage.setItem('demo-token',token);await shopScreen();}catch(err){$('#error').textContent=err.message;}});
$('#order-form').addEventListener('submit',async event=>{event.preventDefault();$('#error').textContent='';$('#confirmation').hidden=true;try{const created=await api('/api/orders','POST',{sku:$('#product').value,quantity:Number($('#quantity').value)});lastOrder=created.id;const order=await api('/api/orders/'+created.id);$('[data-testid="order-id"]').textContent=order.id;$('[data-testid="order-total"]').textContent='$'+(order.total_cents/100).toFixed(2);$('#confirmation').hidden=false;}catch(err){$('#error').textContent=err.message;}});
$('#logout').addEventListener('click',async()=>{try{if(lastOrder){await api('/api/orders/'+lastOrder,'DELETE');lastOrder='';}await api('/api/logout','POST',{});loginScreen();}catch(err){$('#error').textContent=err.message;}});
if(token){shopScreen().catch(loginScreen);}else{loginScreen();}
</script></html>
