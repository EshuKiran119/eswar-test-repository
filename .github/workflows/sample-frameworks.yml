name: Synthetic UI and API framework checks
on:
  workflow_dispatch:
  push:
    paths: ['Playwright-Pytest-BDD-Framework/**', '.github/workflows/sample-frameworks.yml']
  pull_request:
    paths: ['Playwright-Pytest-BDD-Framework/**', '.github/workflows/sample-frameworks.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [api, ui]
    defaults:
      run:
        working-directory: Playwright-Pytest-BDD-Framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Playwright-Pytest-BDD-Framework/requirements.txt
      - run: python -m pip install -r requirements.txt
      - if: matrix.suite == 'ui'
        run: python -m playwright install --with-deps chromium
      - name: Run selected gate
        run: python -m pytest tests/${{ matrix.suite }} -q --junitxml=reports/junit.xml --alluredir=reports/allure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-${{ matrix.suite }}-evidence
          path: Playwright-Pytest-BDD-Framework/reports/
          retention-days: 7
