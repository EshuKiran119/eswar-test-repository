name: Synthetic browser performance smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve browser dependencies
        working-directory: UI-Performance-Framework
        run: mvn --batch-mode dependency:copy-dependencies -DoutputDirectory=deps
      - name: Install JMeter
        run: |
          curl --fail --location --silent --show-error https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz -o /tmp/jmeter.tgz
          tar -xzf /tmp/jmeter.tgz -C /tmp
          google-chrome --version
      - name: Run browser journey gate
        run: python scripts/with_demo.py python UI-Performance-Framework/scripts/run.py --jmeter /tmp/apache-jmeter-5.6.3/bin/jmeter --users 1 --iterations 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-performance-evidence
          path: UI-Performance-Framework/reports/
          retention-days: 7
